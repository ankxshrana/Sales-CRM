services:
  # -------------------------------------------------------------
  # Backend API Web Service (Django 5.1 + Gunicorn + WhiteNoise)
  # -------------------------------------------------------------
  - type: web
    name: sales-crm-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: static
    name: sales-crm-frontend
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
